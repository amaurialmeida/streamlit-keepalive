name: Streamlit Keep-Alive

on:
  schedule:
    # UTC: 00:00, 06:00, 12:00 e 18:00; abaixo de 12h de hibernação.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visitar e despertar os aplicativos
        env:
          PYTHONUNBUFFERED: "1"
          KEEPALIVE_CONCURRENCY: "4"
        run: python keepalive.py
