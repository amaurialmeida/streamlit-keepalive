name: Streamlit Keep-Alive

on:
  schedule:
    # UTC: 00:00, 06:00, 12:00 e 18:00; abaixo de 12h de hibernação.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamlit-keepalive-2
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # O GitHub desativa sozinho os agendamentos de repositórios sem nenhuma
      # atividade por 60 dias. Este passo cria um commit vazio de tempos em
      # tempos para o repositório contar como ativo.
      - name: Manter o agendamento ativo
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((30 * 86400)) ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (mantém o agendamento ativo)"
            git push
          fi

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visitar e despertar os aplicativos
        env:
          PYTHONUNBUFFERED: "1"
          KEEPALIVE_CONCURRENCY: "4"
        run: python keepalive.py
